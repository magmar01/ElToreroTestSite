<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>El Torero Mexican Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#menu">Skip to menu</a>

  <header class="site-header" id="home">
    <div class="navigation">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <button class="menu-nav-trigger" type="button" data-menu-trigger aria-expanded="false">Menu <span aria-hidden="true">▾</span></button>
        <a href="#hours">Hours</a>
        <a href="#contact">Contact</a>
        <a href="#location">Location</a>
        <button class="menu-close" type="button" aria-label="Close navigation">×</button>
      </nav>
    </div>
    <div class="hero-caption">Mexican Comfort Food</div>
  </header>

  <main>
    <section class="menu-section" id="menu" aria-labelledby="menu-title">
      <h1 id="menu-title">Menu</h1>
      <div class="menu-line" aria-hidden="true"></div>
      <div class="menu-grid" data-menu></div>
    </section>

    <section class="hours-section" id="hours" aria-labelledby="hours-title">
      <h1 id="hours-title">Hours</h1>
      <div class="menu-line" aria-hidden="true"></div>
      <div class="hours-grid">
        <strong>Sunday</strong><span>Closed</span>
        <strong>Monday–Saturday</strong><span>11am–9pm</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <section class="contact-section" id="contact" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact</h1>
      <p>3656 Satellite Boulevard, Duluth, GA 30043</p>
      <p><a href="tel:+17704764320">(770) 476-4320</a></p>
      <p>Fax: (770) 476-9683</p>
      <p><a href="mailto:ElToreroDuluth@gmail.com">ElToreroDuluth@gmail.com</a></p>
    </section>

    <section class="location-section" id="location" aria-labelledby="location-title">
      <h1 id="location-title">Location</h1>
      <div class="map-wrap">
        <iframe title="El Torero Mexican Restaurant location" src="https://www.google.com/maps?q=3656+Satellite+Boulevard,+Duluth,+GA+30043&output=embed" loading="lazy"></iframe>
      </div>
    </section>

    <p class="copyright">© El Torero Mexican Restaurant</p>
  </footer>

  <script src="menu.js" defer></script>
  <script src="menu-renderer.js" defer></script>
  <script src="site.js" defer></script>
</body>
</html>
